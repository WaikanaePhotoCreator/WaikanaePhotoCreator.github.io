<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Waikanae Amazing Foto Creator</title>
	<link rel="stylesheet" href="stylesheet.css">
	<script src="script.js"></script>
  </head>
  <body onload="currentSlide(1)">
    <main>
	<h1> Waikanae AFC </h1>
	
		<!-- Slideshow container -->
	<div class="slideshow-container">

	  <!-- Full-width images with number and caption text -->
	  <div class="mySlides fade">
		<div class="numbertext">1 / 3</div>
		<a href="./resources/matchday.html">
			<img src="./resources/slideshowexamples/matchday.png" style="width:100%">
		</a>
		<div class="text">Create a Match Day Image</div>
	  </div>

	  <div class="mySlides fade">
		<div class="numbertext">2 / 3</div>
		<a href="./resources/scorebuilder.html">
			<img src="./resources/slideshowexamples/score.png" style="width:100%">
		</a>
		<div class="text">Create a Scoreline Image</div>
	  </div>
	  
	  <div class="mySlides fade">
		<div class="numbertext">3 / 3</div>
		<a href="./resources/upnext.html">
			<img src="./resources/slideshowexamples/upnext.jpg" style="width:100%">
		</a>
		<div class="text">Create an Up Next Image</div>
	  </div>

	  <!-- Next and previous buttons -->
	  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
	  <a class="next" onclick="plusSlides(1)">&#10095;</a>
	</div>
	<br>

	<!-- The dots/circles -->
	<div style="text-align:center">
	  <span class="dot" onclick="currentSlide(1)"></span>
	  <span class="dot" onclick="currentSlide(2)"></span>
	  <span class="dot" onclick="currentSlide(3)"></span>
	</div>

    </main>
  </body>
</html>
